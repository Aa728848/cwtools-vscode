name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_OPTIONS: "--max-old-space-size=4096"

jobs:
  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run check:lsp-contract
      - run: npm run check:rust-only
      - run: npm run lint
      - run: npm run compile
      - run: npm run typecheck:test
      - run: npm run test:unit
      - run: npm run check:mcp-schema

  rust-core:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix: { os: [ubuntu-latest, windows-latest, macos-latest] }
    defaults:
      run: { working-directory: submodules/cwtools }
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - uses: dtolnay/rust-toolchain@stable
        with: { components: rustfmt, clippy }
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace --all-targets --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  rust-lsp:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix: { os: [ubuntu-latest, windows-latest, macos-latest] }
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - uses: dtolnay/rust-toolchain@stable
        with: { components: rustfmt, clippy }
      - run: cargo fmt --manifest-path rust/Cargo.toml --all -- --check
      - run: cargo test --manifest-path rust/Cargo.toml --workspace --all-targets --locked
      - run: cargo clippy --manifest-path rust/Cargo.toml --workspace --all-targets --locked -- -D warnings

  rust-release-artifacts:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {
              os: windows-latest,
              rid: win-x64,
              target: x86_64-pc-windows-msvc,
              binary: cwtools-lsp.exe,
              staged: "CWTools Server.exe",
            }
          - {
              os: ubuntu-latest,
              rid: linux-x64,
              target: x86_64-unknown-linux-gnu,
              binary: cwtools-lsp,
              staged: "CWTools Server",
            }
          - {
              os: macos-latest,
              rid: osx-x64,
              target: x86_64-apple-darwin,
              binary: cwtools-lsp,
              staged: "CWTools Server",
            }
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - uses: dtolnay/rust-toolchain@stable
      - name: Build standalone Rust server
        run: cargo build --manifest-path rust/Cargo.toml --release --locked --target ${{ matrix.target }}
      - name: Stage Windows server
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "release/bin/server/${{ matrix.rid }}" | Out-Null
          Copy-Item "rust/target/${{ matrix.target }}/release/${{ matrix.binary }}" "release/bin/server/${{ matrix.rid }}/${{ matrix.staged }}"
      - name: Stage Unix server
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p "release/bin/server/${{ matrix.rid }}"
          cp "rust/target/${{ matrix.target }}/release/${{ matrix.binary }}" "release/bin/server/${{ matrix.rid }}/${{ matrix.staged }}"
          chmod +x "release/bin/server/${{ matrix.rid }}/${{ matrix.staged }}"
      - uses: actions/upload-artifact@v4
        with:
          name: cwtools-server-${{ matrix.rid }}
          path: release/bin/server/${{ matrix.rid }}/${{ matrix.staged }}
          if-no-files-found: error

  universal-vsix:
    needs: [typescript, rust-release-artifacts]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          pattern: cwtools-server-*
          path: release/bin/server
          merge-multiple: false
      - name: Normalize downloaded server layout
        shell: bash
        run: |
          for rid in win-x64 linux-x64 osx-x64; do
            test -d "release/bin/server/cwtools-server-$rid"
            rm -rf "release/bin/server/$rid"
            mv "release/bin/server/cwtools-server-$rid" "release/bin/server/$rid"
          done
          chmod +x "release/bin/server/linux-x64/CWTools Server" "release/bin/server/osx-x64/CWTools Server"
      - run: npm run compile
      - run: npm run build:docs
      - run: npm run check:rust-only
      - run: npm run check:release -- --skip-compile --skip-test
      - name: Package universal VSIX
        working-directory: release
        run: npx @vscode/vsce package
      - name: Verify packaged universal VSIX
        shell: bash
        run: |
          vsix=$(find release -maxdepth 1 -name '*.vsix' -type f -print -quit)
          test -n "$vsix"
          node tools/check-vsix.js --vsix "$vsix"
      - uses: actions/upload-artifact@v4
        with:
          name: cwtools-universal-vsix
          path: release/*.vsix
          if-no-files-found: error

  publish-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [universal-vsix, rust-core, rust-lsp, mcp-contracts]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: cwtools-universal-vsix
          path: release
      - name: Verify tag and universal VSIX
        shell: bash
        run: |
          version=$(node -p "require('./release/package.json').version")
          test "${GITHUB_REF_NAME}" = "v$version"
          vsix=$(find release -maxdepth 1 -name "*-$version.vsix" -type f)
          test $(printf '%s\n' "$vsix" | grep -c .) -eq 1
          node tools/check-vsix.js --vsix "$vsix"
      - name: Publish immutable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          version=$(node -p "require('./release/package.json').version")
          vsix=$(find release -maxdepth 1 -name "*-$version.vsix" -type f)
          gh release create "$GITHUB_REF_NAME" "$vsix" --repo "$GITHUB_REPOSITORY" --verify-tag --title "$GITHUB_REF_NAME" --generate-notes

  mcp-contracts:
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: submodules/cwtools-mcp }
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - uses: actions/setup-node@v4
        with:
          {
            node-version: 22,
            cache: npm,
            cache-dependency-path: submodules/cwtools-mcp/package-lock.json,
          }
      - run: npm ci
      - run: npm run build
      - run: npm run test:contracts
