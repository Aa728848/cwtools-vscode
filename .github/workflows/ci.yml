name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_OPTIONS: "--max-old-space-size=4096"

jobs:
  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run check:lsp-contract
      - run: npm run check:rust-only
      - run: npm run lint
      - run: npm run compile
      - run: npm run typecheck:test
      - run: npm run test:unit
      - run: npm run check:mcp-schema

  rust-core:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix: { os: [ubuntu-latest, windows-latest, macos-latest] }
    defaults:
      run: { working-directory: submodules/cwtools }
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - uses: dtolnay/rust-toolchain@stable
        with: { components: rustfmt, clippy }
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace --all-targets --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  rust-lsp:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix: { os: [ubuntu-latest, windows-latest, macos-latest] }
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - uses: dtolnay/rust-toolchain@stable
        with: { components: rustfmt, clippy }
      - run: cargo fmt --manifest-path rust/Cargo.toml --all -- --check
      - run: cargo test --manifest-path rust/Cargo.toml --workspace --all-targets --locked
      - run: cargo clippy --manifest-path rust/Cargo.toml --workspace --all-targets --locked -- -D warnings

  release-platform-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.platforms.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: platforms
        run: node tools/release-platform-matrix.cjs

  rust-release-artifacts:
    needs: release-platform-matrix
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.release-platform-matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - uses: dtolnay/rust-toolchain@stable
      - name: Build standalone Rust server
        run: cargo build --manifest-path rust/Cargo.toml --release --locked --target ${{ matrix.target }}
      - name: Stage Windows server
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "release/bin/server/${{ matrix.rid }}" | Out-Null
          Copy-Item "rust/target/${{ matrix.target }}/release/${{ matrix.binary }}" "release/bin/server/${{ matrix.rid }}/${{ matrix.staged }}"
      - name: Stage Unix server
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p "release/bin/server/${{ matrix.rid }}"
          cp "rust/target/${{ matrix.target }}/release/${{ matrix.binary }}" "release/bin/server/${{ matrix.rid }}/${{ matrix.staged }}"
          chmod +x "release/bin/server/${{ matrix.rid }}/${{ matrix.staged }}"
      - name: Write artifact provenance manifest
        run: node tools/write-release-artifact-manifest.cjs --rid ${{ matrix.rid }} --binary "release/bin/server/${{ matrix.rid }}/${{ matrix.staged }}" --output "release/bin/server/${{ matrix.rid }}/artifact-manifest.json" --source-sha ${{ github.sha }}
      - uses: actions/upload-artifact@v4
        with:
          name: cwtools-server-${{ matrix.rid }}
          path: |
            release/bin/server/${{ matrix.rid }}/${{ matrix.staged }}
            release/bin/server/${{ matrix.rid }}/artifact-manifest.json
          if-no-files-found: error

  universal-vsix:
    needs: [typescript, rust-release-artifacts]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: cwtools-server-win-x64
          path: artifacts/universal-server/cwtools-server-win-x64
      - uses: actions/download-artifact@v4
        with:
          name: cwtools-server-linux-x64
          path: artifacts/universal-server/cwtools-server-linux-x64
      - uses: actions/download-artifact@v4
        with:
          name: cwtools-server-osx-x64
          path: artifacts/universal-server/cwtools-server-osx-x64
      - name: Aggregate, package, and verify exact universal VSIX
        run: npm run pack:universal
      - uses: actions/upload-artifact@v4
        with:
          name: cwtools-universal-vsix
          path: |
            release/*.vsix
            release/*.vsix.sha256
          if-no-files-found: error

  publish-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [universal-vsix, rust-core, rust-lsp, mcp-contracts]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: cwtools-universal-vsix
          path: release
      - name: Verify tag, exact immutable VSIX, and checksum
        shell: bash
        run: |
          version=$(node -p "require('./release/package.json').version")
          test "${GITHUB_REF_NAME}" = "v$version"
          vsix="release/foreverskywalker-stellaris-cwtools-$version.vsix"
          test -f "$vsix"
          test -f "$vsix.sha256"
          sha256sum --check "$vsix.sha256"
          node tools/check-vsix.js --vsix "$vsix" --source-sha "$GITHUB_SHA"
      - name: Publish immutable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          version=$(node -p "require('./release/package.json').version")
          vsix="release/foreverskywalker-stellaris-cwtools-$version.vsix"
          gh release create "$GITHUB_REF_NAME" "$vsix" "$vsix.sha256" --repo "$GITHUB_REPOSITORY" --verify-tag --title "$GITHUB_REF_NAME" --generate-notes

  mcp-contracts:
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: submodules/cwtools-mcp }
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - uses: actions/setup-node@v4
        with:
          {
            node-version: 22,
            cache: npm,
            cache-dependency-path: submodules/cwtools-mcp/package-lock.json,
          }
      - run: npm ci
      - run: npm run build
      - run: npm run test:contracts
