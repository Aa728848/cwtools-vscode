name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_OPTIONS: "--max-old-space-size=4096"

jobs:
  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run verify
      - run: npm run check:mcp-schema

  rust-core:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix: { os: [ubuntu-latest, windows-latest, macos-latest] }
    defaults:
      run: { working-directory: submodules/cwtools }
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - uses: dtolnay/rust-toolchain@stable
        with: { components: rustfmt, clippy }
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace --all-targets --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  rust-lsp:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix: { os: [ubuntu-latest, windows-latest, macos-latest] }
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - uses: dtolnay/rust-toolchain@stable
        with: { components: rustfmt, clippy }
      - run: cargo fmt --manifest-path rust/Cargo.toml --all -- --check
      - run: cargo test --manifest-path rust/Cargo.toml --workspace --all-targets --locked
      - run: cargo clippy --manifest-path rust/Cargo.toml --workspace --all-targets --locked -- -D warnings

  rust-release-artifacts:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, rid: win-x64, binary: cwtools-lsp.exe, staged: 'CWTools Server.exe' }
          - { os: ubuntu-latest, rid: linux-x64, binary: cwtools-lsp, staged: 'CWTools Server' }
          - { os: macos-latest, rid: osx-x64, binary: cwtools-lsp, staged: 'CWTools Server' }
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - uses: dtolnay/rust-toolchain@stable
      - name: Build standalone Rust server
        run: cargo build --manifest-path rust/Cargo.toml --release --locked
      - name: Stage Windows server
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "release/bin/server/${{ matrix.rid }}" | Out-Null
          Copy-Item "rust/target/release/${{ matrix.binary }}" "release/bin/server/${{ matrix.rid }}/${{ matrix.staged }}"
      - name: Stage Unix server
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p "release/bin/server/${{ matrix.rid }}"
          cp "rust/target/release/${{ matrix.binary }}" "release/bin/server/${{ matrix.rid }}/${{ matrix.staged }}"
          chmod +x "release/bin/server/${{ matrix.rid }}/${{ matrix.staged }}"
      - uses: actions/upload-artifact@v4
        with:
          name: cwtools-server-${{ matrix.rid }}
          path: release/bin/server/${{ matrix.rid }}/${{ matrix.staged }}
          if-no-files-found: error

  universal-vsix:
    needs: [typescript, rust-release-artifacts]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          pattern: cwtools-server-*
          path: release/bin/server
          merge-multiple: false
      - name: Normalize downloaded server layout
        shell: bash
        run: |
          for rid in win-x64 linux-x64 osx-x64; do
            test -d "release/bin/server/cwtools-server-$rid"
            rm -rf "release/bin/server/$rid"
            mv "release/bin/server/cwtools-server-$rid" "release/bin/server/$rid"
          done
          chmod +x "release/bin/server/linux-x64/CWTools Server" "release/bin/server/osx-x64/CWTools Server"
      - run: npm run compile
      - run: npm run build:docs
      - run: npm run check:rust-only
      - run: npm run check:release -- --skip-compile --skip-test
      - name: Package universal VSIX
        working-directory: release
        run: npx @vscode/vsce package
      - uses: actions/upload-artifact@v4
        with:
          name: cwtools-universal-vsix
          path: release/*.vsix
          if-no-files-found: error

  mcp-contracts:
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: submodules/cwtools-mcp }
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: submodules/cwtools-mcp/package-lock.json }
      - run: npm ci
      - run: npm run build
      - run: npm run test:contracts
