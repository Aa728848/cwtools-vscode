[workspace]
resolver = "2"
members = ["cwtools-lsp"]

[workspace.package]
edition = "2024"
license = "MIT"
rust-version = "1.85"

[workspace.dependencies]
cwtools-protocol = { path = "../submodules/cwtools/crates/cwtools-protocol" }
cwtools-transport = { path = "../submodules/cwtools/crates/cwtools-transport" }
cwtools-source = { path = "../submodules/cwtools/crates/cwtools-source" }
cwtools-leaf = { path = "../submodules/cwtools/crates/cwtools-leaf" }
cwtools-script-syntax = { path = "../submodules/cwtools/crates/cwtools-script-syntax" }
cwtools-game-core = { path = "../submodules/cwtools/crates/cwtools-game-core" }
cwtools-cache = { path = "../submodules/cwtools/crates/cwtools-cache" }
cwtools-workspace = { path = "../submodules/cwtools/crates/cwtools-workspace" }
cwtools-rule-ir = { path = "../submodules/cwtools/crates/cwtools-rule-ir" }
cwtools-rules-engine = { path = "../submodules/cwtools/crates/cwtools-rules-engine" }
cwtools-shader = { path = "../submodules/cwtools/crates/cwtools-shader" }
cwtools-semantic = { path = "../submodules/cwtools/crates/cwtools-semantic" }
serde_json = "1.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "deny"
pedantic = "warn"
